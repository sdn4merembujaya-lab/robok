<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koding Matematika</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1B3A63;
    --cream:#FFFCF6;
    --line:#CFE0F2;
    --tray:#B9C3CC;
    --stand:#3E6491;
    --green-ok:#2FAE60;
    --red-no:#E6483C;

    --op-tambah:#2F8F5B;
    --op-kurang:#D8532C;
    --op-kali:#7C4DBE;
    --op-bagi:#1E88C7;

    --c1:#3B82F6; --c2:#22C55E; --c3:#E53E3E; --c4:#F5C518;
    --c5:#6D28D9; --c6:#F2790F; --c7:#7A1F2B; --c8:#EC4899;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Nunito',sans-serif;
    background:var(--cream);
    color:var(--navy);
    padding:20px 14px 60px;
  }
  h1{
    font-family:'Baloo 2',sans-serif;
    font-size:clamp(26px,6vw,42px);
    text-align:center;
    letter-spacing:.5px;
    margin:6px 0 4px;
    color:var(--navy);
  }
  .sub{
    text-align:center;
    font-weight:700;
    font-size:14px;
    color:#3E5A7A;
    margin:0 auto 18px;
    max-width:520px;
  }

  /* mode tabs */
  .tabs{
    display:flex;
    gap:8px;
    max-width:560px;
    margin:0 auto 20px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .tab{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:15px;
    border:none;
    border-radius:14px;
    padding:10px 16px;
    cursor:pointer;
    color:#fff;
    opacity:.55;
    transition:transform .12s ease, opacity .12s ease;
  }
  .tab:hover{transform:translateY(-1px);}
  .tab.active{opacity:1; box-shadow:0 3px 0 rgba(0,0,0,.15);}
  .tab[data-op="tambah"]{background:var(--op-tambah);}
  .tab[data-op="kurang"]{background:var(--op-kurang);}
  .tab[data-op="kali"]{background:var(--op-kali);}
  .tab[data-op="bagi"]{background:var(--op-bagi);}

  /* legend */
  .legend{
    max-width:560px;
    margin:0 auto 26px;
    border:2px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }
  .legend-row{display:flex;}
  .legend-row div{
    flex:1;
    text-align:center;
    padding:8px 0;
    border-right:1px solid var(--line);
    font-weight:800;
  }
  .legend-row div:last-child{border-right:none;}
  .legend-row.numbers{color:var(--navy); font-size:18px;}
  .legend-row.shirts{background:#F7FAFD; padding:6px 0;}
  .shirt{
    width:26px;height:24px;
    margin:0 auto;
    border-radius:6px 6px 3px 3px;
    position:relative;
  }
  .shirt::before{ /* sleeves */
    content:"";
    position:absolute; top:0; left:-6px;
    width:8px;height:10px;
    background:inherit;
    border-radius:4px;
  }
  .shirt::after{
    content:"";
    position:absolute; top:0; right:-6px;
    width:8px;height:10px;
    background:inherit;
    border-radius:4px;
  }

  /* puzzle grid */
  #board{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:22px 14px;
    max-width:640px;
    margin:0 auto;
  }
  @media (max-width:640px){
    #board{grid-template-columns:repeat(2,1fr);}
  }
  .card{
    background:#fff;
    border:2px solid var(--line);
    border-radius:14px;
    padding:12px 8px 16px;
    text-align:center;
  }
  .op-badge{
    display:inline-block;
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    font-size:14px;
    color:#fff;
    border-radius:8px;
    padding:2px 8px;
    margin-bottom:6px;
  }
  .card[data-op="tambah"] .op-badge{background:var(--op-tambah);}
  .card[data-op="kurang"] .op-badge{background:var(--op-kurang);}
  .card[data-op="kali"] .op-badge{background:var(--op-kali);}
  .card[data-op="bagi"] .op-badge{background:var(--op-bagi);}

  .tray-zone{
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:4px;
    height:40px;
    margin-bottom:2px;
  }
  .numtile{
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    font-size:16px;
    color:var(--navy);
    background:#F7FAFD;
    border:2px solid var(--line);
    border-radius:8px;
    padding:4px 8px;
    min-width:26px;
  }
  .tray-plate{
    width:64px; height:10px;
    background:var(--tray);
    border-radius:6px;
    margin:2px auto 0;
    box-shadow:0 2px 0 rgba(0,0,0,.08);
  }
  .stand{
    width:46px; height:34px;
    background:var(--stand);
    margin:0 auto;
    border-radius:0 0 8px 8px;
    position:relative;
  }
  .stand::before{
    content:"";
    position:absolute; left:50%; top:-6px;
    transform:translateX(-50%);
    width:6px; height:8px;
    background:var(--stand);
  }
  .answer-circle{
    width:56px;height:56px;
    border-radius:50%;
    border:3px solid var(--stand);
    background:#fff;
    margin:6px auto 0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .answer-circle input{
    width:100%;
    text-align:center;
    border:none;
    outline:none;
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    font-size:18px;
    color:var(--navy);
    background:transparent;
  }
  .card.correct .answer-circle{border-color:var(--green-ok); background:#EAFBF1;}
  .card.wrong .answer-circle{border-color:var(--red-no); background:#FDECEA;}

  /* controls */
  .controls{
    max-width:640px;
    margin:26px auto 0;
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
  }
  button.action{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:15px;
    border:none;
    border-radius:12px;
    padding:11px 22px;
    color:#fff;
    cursor:pointer;
    box-shadow:0 3px 0 rgba(0,0,0,.15);
  }
  button.action:active{transform:translateY(2px); box-shadow:none;}
  #checkBtn{background:var(--navy);}
  #newBtn{background:#5A7A9E;}

  #result{
    text-align:center;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:16px;
    margin-top:16px;
    min-height:24px;
    color:var(--navy);
  }

  /* ===== topbar navigasi (nama siswa / lanjut / keluar) ===== */
  .topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
    flex-wrap:wrap;gap:8px;background:#fff;border-bottom:3px solid var(--line);padding:10px 16px;
    margin:-20px -14px 10px;}
  .topbar-user{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13.5px;color:var(--navy);
    font-family:'Baloo 2',sans-serif;}
  .topbar-user .tb-avatar{font-size:20px;}
  .topbar-progress{font-weight:700;font-size:12px;color:var(--navy);background:#F7FAFD;
    border:1px solid var(--line);border-radius:20px;padding:4px 10px;}
  .topbar-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .topbar-btn{border:none;border-radius:12px;font-weight:700;font-size:12.5px;padding:8px 14px;
    cursor:pointer;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18);font-family:'Baloo 2',sans-serif;}
  .topbar-btn:active{transform:translateY(2px);box-shadow:none;}
  .topbar-home{background:#5A7A9E;box-shadow:0 3px 0 #3E5A7A;}
  .topbar-next{background:var(--stand);box-shadow:0 3px 0 #2b4a6b;}
  .topbar-logout{background:var(--red-no);box-shadow:0 3px 0 #a8352c;}
  @media(max-width:480px){.topbar{padding:8px 10px;} .topbar-progress{display:none;}}
</style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-user"><span class="tb-avatar">🧑‍🎓</span><span id="tbName">Siswa</span></div>
    <div class="topbar-actions">
      <span class="topbar-progress" id="tbProgress"></span>
      <button class="topbar-btn topbar-home" id="tbHome" title="Daftar Ladang">🏠</button>
      <button class="topbar-btn topbar-next" id="tbNext">Lanjut ➡️</button>
      <button class="topbar-btn topbar-logout" id="tbLogout">🚪 Keluar</button>
    </div>
  </div>
  <script>
  (function(){
    var LADANG_ORDER = ['robo-kebun.html','robo-kebun-blok.html','ladang-pola.html','aktivitas-interaktif.html','matematika.html'];
    var LADANG_LABELS = ['Robo Kebun','Kode Blok','Ladang Pola','Aktivitas Interaktif','Matematika'];
    var THIS_FILE = 'matematika.html';
    var idx = LADANG_ORDER.indexOf(THIS_FILE);

    var raw = sessionStorage.getItem('robokebun_user');
    if(!raw){ window.location.href = 'login.html'; }
    var sess = null;
    try{ sess = JSON.parse(raw); }catch(e){}

    window.addEventListener('DOMContentLoaded', function(){
      var nameEl = document.getElementById('tbName');
      if(nameEl){
        var u = (sess && sess.user) || {};
        nameEl.textContent = u.name || u.nama || (sess && sess.username) || 'Siswa';
      }
      var progEl = document.getElementById('tbProgress');
      if(progEl) progEl.textContent = 'Ladang ' + (idx+1) + ' dari ' + LADANG_ORDER.length;

      var homeBtn = document.getElementById('tbHome');
      if(homeBtn) homeBtn.onclick = function(){ window.location.href = 'index.html'; };

      var nextBtn = document.getElementById('tbNext');
      if(nextBtn){
        var nextFile = LADANG_ORDER[idx+1];
        if(nextFile){
          nextBtn.textContent = 'Lanjut: ' + LADANG_LABELS[idx+1] + ' ➡️';
          nextBtn.onclick = function(){ window.location.href = nextFile; };
        } else {
          nextBtn.textContent = '🏁 Selesai Semua!';
          nextBtn.onclick = function(){ window.location.href = 'index.html'; };
        }
      }
      var logoutBtn = document.getElementById('tbLogout');
      if(logoutBtn){
        logoutBtn.onclick = function(){
          sessionStorage.removeItem('robokebun_user');
          window.location.href = 'login.html';
        };
      }
    });
  })();
  </script>

  <script>
  var SCORE_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwCJEpXP9XuKDik6Wbwk78Jq0jkd4Yp394DXskwYdFR_Dnx3zdd8_q54yav1ZPIOn5wAg/exec';

  function kirimSkorOtomatis(moduleKey, poin){
    try{
      if (localStorage.getItem('skorkirim_' + moduleKey) === 'true') return;
      var raw = sessionStorage.getItem('robokebun_user');
      if (!raw) return;
      var sess = JSON.parse(raw);
      var username = (sess.user && sess.user.username) || sess.username;
      if (!username) return;
      fetch(SCORE_APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'tambahSkor', username: username, poin: poin })
      }).then(function(){
        localStorage.setItem('skorkirim_' + moduleKey, 'true');
      }).catch(function(){});
    }catch(e){}
  }

  function kirimSkorTambahan(poin){
    try{
      var raw = sessionStorage.getItem('robokebun_user');
      if (!raw) return;
      var sess = JSON.parse(raw);
      var username = (sess.user && sess.user.username) || sess.username;
      if (!username) return;
      fetch(SCORE_APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'tambahSkor', username: username, poin: poin })
      }).catch(function(){});
    }catch(e){}
  }
  </script>

<h1>KODING MATEMATIKA</h1>
<p class="sub" id="subtitle">Kerjakanlah operasi hitung penjumlahan di bawah ini dengan benar!</p>

<div class="tabs">
  <button class="tab active" data-op="tambah">+ Penjumlahan</button>
  <button class="tab" data-op="kurang">− Pengurangan</button>
  <button class="tab" data-op="kali">× Perkalian</button>
  <button class="tab" data-op="bagi">÷ Pembagian</button>
</div>

<div class="legend">
  <div class="legend-row numbers" id="legendNumbers"></div>
  <div class="legend-row shirts" id="legendShirts"></div>
</div>

<div id="board"></div>

<div class="controls">
  <button class="action" id="checkBtn">Periksa Jawaban</button>
  <button class="action" id="newBtn">Acak Soal Baru</button>
</div>
<div id="result"></div>

<script>
const COLORS = [
  {n:1, hex:'var(--c1)'},
  {n:2, hex:'var(--c2)'},
  {n:3, hex:'var(--c3)'},
  {n:4, hex:'var(--c4)'},
  {n:5, hex:'var(--c5)'},
  {n:6, hex:'var(--c6)'},
  {n:7, hex:'var(--c7)'},
  {n:8, hex:'var(--c8)'},
];

const SUBTITLES = {
  tambah: 'Kerjakanlah operasi hitung penjumlahan di bawah ini dengan benar!',
  kurang: 'Kerjakanlah operasi hitung pengurangan di bawah ini dengan benar!',
  kali:   'Kerjakanlah operasi hitung perkalian di bawah ini dengan benar!',
  bagi:   'Kerjakanlah operasi hitung pembagian di bawah ini dengan benar!'
};
const SYMBOLS = { tambah:'+', kurang:'−', kali:'×', bagi:'÷' };

let currentOp = 'tambah';
let puzzles = [];

function buildLegend(){
  const nums = document.getElementById('legendNumbers');
  const shirts = document.getElementById('legendShirts');
  nums.innerHTML = '';
  shirts.innerHTML = '';
  COLORS.forEach(c=>{
    const nd = document.createElement('div');
    nd.textContent = c.n;
    nums.appendChild(nd);

    const sd = document.createElement('div');
    const shirt = document.createElement('div');
    shirt.className = 'shirt';
    shirt.style.background = c.hex;
    sd.appendChild(shirt);
    shirts.appendChild(sd);
  });
}

function rand(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pickColor(){ return COLORS[rand(0,7)]; }

function genPuzzle(op){
  if(op==='tambah'){
    const a = pickColor(), b = pickColor();
    return {op, a, b, answer: a.n + b.n};
  }
  if(op==='kurang'){
    let a = pickColor(), b = pickColor();
    while(b.n === a.n){ b = pickColor(); }
    if(b.n > a.n){ [a,b] = [b,a]; }
    return {op, a, b, answer: a.n - b.n};
  }
  if(op==='kali'){
    const a = COLORS[rand(0,5)], b = COLORS[rand(0,5)]; // batasi 1-6 biar hasil tidak kepanjangan
    return {op, a, b, answer: a.n * b.n};
  }
  if(op==='bagi'){
    const divisor = COLORS[rand(1,7)]; // 2..8, hindari bagi 1 biar tetap menantang
    const quotient = rand(1,8);
    const dividend = divisor.n * quotient;
    return {op, divisor, dividend, answer: quotient};
  }
}

function shirtEl(color){
  const s = document.createElement('div');
  s.className = 'shirt';
  s.style.background = color.hex;
  return s;
}

function renderBoard(){
  const board = document.getElementById('board');
  board.innerHTML = '';
  puzzles.forEach((p, idx)=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.op = p.op;
    card.dataset.idx = idx;

    const badge = document.createElement('div');
    badge.className = 'op-badge';
    badge.textContent = SYMBOLS[p.op];
    card.appendChild(badge);

    const trayZone = document.createElement('div');
    trayZone.className = 'tray-zone';

    if(p.op === 'bagi'){
      const tile = document.createElement('div');
      tile.className = 'numtile';
      tile.textContent = p.dividend;
      trayZone.appendChild(tile);
      trayZone.appendChild(shirtEl(p.divisor));
    } else {
      trayZone.appendChild(shirtEl(p.a));
      trayZone.appendChild(shirtEl(p.b));
    }
    card.appendChild(trayZone);

    const plate = document.createElement('div');
    plate.className = 'tray-plate';
    card.appendChild(plate);

    const stand = document.createElement('div');
    stand.className = 'stand';
    card.appendChild(stand);

    const circle = document.createElement('div');
    circle.className = 'answer-circle';
    const input = document.createElement('input');
    input.type = 'number';
    input.inputMode = 'numeric';
    circle.appendChild(input);
    card.appendChild(circle);

    board.appendChild(card);
  });
}

function newRound(op){
  puzzles = [];
  for(let i=0;i<8;i++){ puzzles.push(genPuzzle(op)); }
  renderBoard();
  document.getElementById('result').textContent = '';
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('correct','wrong'));
}

document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentOp = btn.dataset.op;
    document.getElementById('subtitle').textContent = SUBTITLES[currentOp];
    newRound(currentOp);
  });
});

document.getElementById('newBtn').addEventListener('click', ()=> newRound(currentOp));

document.getElementById('checkBtn').addEventListener('click', ()=>{
  const cards = document.querySelectorAll('.card');
  let correctCount = 0;
  cards.forEach((card, idx)=>{
    const input = card.querySelector('input');
    const val = parseInt(input.value, 10);
    card.classList.remove('correct','wrong');
    if(val === puzzles[idx].answer){
      card.classList.add('correct');
      correctCount++;
    } else {
      card.classList.add('wrong');
    }
  });
  const result = document.getElementById('result');
  if(correctCount === cards.length){
    result.textContent = 'Hebat! Semua jawaban benar! ⭐⭐⭐';
    result.style.color = 'var(--green-ok)';
    kirimSkorTambahan(2);
  } else {
    result.textContent = `Skor kamu: ${correctCount} dari ${cards.length}. Coba periksa lagi yang berwarna merah!`;
    result.style.color = 'var(--red-no)';
  }
});

buildLegend();
newRound(currentOp);
</script>
</body>
</html>

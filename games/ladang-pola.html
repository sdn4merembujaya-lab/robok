<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Ladang Pola — Ayo Ngoding!</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* ===== palet: ladang bunga sore hari (senada dengan dunia Robo Kebun, nuansa berbeda) ===== */
    --sky-top:#ffd9a0;--sky-bottom:#fff3da;
    --soil:#7a4a2b;--soil-dark:#5e3620;
    --card:#fffaf0;
    --ink:#3a2f2a;--ink-soft:#7a6a5c;

    --c-merah:#e2555f;--c-merah-dark:#b93b46;
    --c-kuning:#f4c548;--c-kuning-dark:#cf9e1f;
    --c-biru:#4a9fc9;--c-biru-dark:#2f7796;
    --c-hijau:#5ba64a;--c-hijau-dark:#3f7d34;
    --c-ungu:#9b72cf;--c-ungu-dark:#7550a8;
    --c-oranye:#e88a3c;--c-oranye-dark:#bf6a26;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Quicksand',sans-serif;color:var(--ink);
    background:linear-gradient(180deg,var(--sky-top) 0%, var(--sky-bottom) 55%);
    min-height:100vh;overflow-x:hidden;
  }
  h1,h2,h3,.display{font-family:'Fredoka',sans-serif;}
  button{font-family:inherit;}

  .header{position:relative;z-index:5;text-align:center;padding:22px 16px 6px;}
  .eyebrow{display:inline-block;background:var(--c-ungu);color:#fff;font-weight:700;font-size:12px;
    letter-spacing:.04em;padding:5px 14px;border-radius:20px;box-shadow:0 3px 0 var(--c-ungu-dark);
    margin-bottom:10px;}
  .header h1{margin:0;font-size:32px;color:var(--soil-dark);letter-spacing:.01em;}
  .header p{margin:6px 0 0;color:var(--ink-soft);font-weight:600;font-size:14px;}

  .level-row{position:relative;z-index:5;display:flex;justify-content:center;gap:9px;
    padding:16px 10px 4px;flex-wrap:wrap;max-width:640px;margin:0 auto;}
  .level-dot{width:38px;height:38px;border-radius:50%;border:3px solid var(--c-ungu-dark);
    background:var(--card);font-weight:700;font-size:14px;color:var(--c-ungu-dark);cursor:pointer;
    display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--c-ungu-dark);
    transition:transform .1s;flex-shrink:0;}
  .level-dot:hover{transform:translateY(-2px);}
  .level-dot.active{background:var(--c-ungu);color:#fff;}
  .level-dot.solved{background:var(--c-kuning);border-color:var(--c-kuning-dark);color:var(--soil-dark);
    box-shadow:0 3px 0 var(--c-kuning-dark);}
  .level-dot.solved::after{content:'✓';}

  .stage{position:relative;z-index:5;max-width:760px;margin:14px auto 40px;padding:0 16px;}

  .card{background:var(--card);border:4px solid var(--soil);border-radius:22px;
    padding:20px 18px;box-shadow:0 8px 0 rgba(0,0,0,.08);}
  .card-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:8px;}
  .card-title h2{margin:0;font-size:19px;color:var(--soil-dark);}
  .card p.instr{margin:0 0 18px;color:var(--ink-soft);font-weight:600;font-size:13.5px;}

  /* ===== deret pola (flower row) ===== */
  .pattern-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;
    background:#f6ecd9;border:3px dashed #e0cda0;border-radius:16px;padding:18px 14px;margin-bottom:20px;}
  .flower{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:24px;position:relative;box-shadow:0 4px 0 rgba(0,0,0,.14);flex-shrink:0;
    transition:transform .15s, box-shadow .15s;}
  .flower.filled{color:#fff;}
  .flower.blank{background:#fff;border:3px dashed #cbb98c;box-shadow:none;color:#cbb98c;font-weight:800;
    cursor:pointer;}
  .flower.blank.selected{border-color:var(--c-ungu);background:#f2e9ff;color:var(--c-ungu);
    transform:translateY(-3px);box-shadow:0 4px 0 var(--c-ungu-dark);}
  .flower.blank.wrong{background:#fbe1e1;border-color:var(--c-merah);animation:shake .35s;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}

  .color-merah{background:var(--c-merah);box-shadow:0 4px 0 var(--c-merah-dark);}
  .color-kuning{background:var(--c-kuning);box-shadow:0 4px 0 var(--c-kuning-dark);}
  .color-biru{background:var(--c-biru);box-shadow:0 4px 0 var(--c-biru-dark);}
  .color-hijau{background:var(--c-hijau);box-shadow:0 4px 0 var(--c-hijau-dark);}
  .color-ungu{background:var(--c-ungu);box-shadow:0 4px 0 var(--c-ungu-dark);}
  .color-oranye{background:var(--c-oranye);box-shadow:0 4px 0 var(--c-oranye-dark);}

  /* ===== palet warna untuk dipilih ===== */
  .palette-label{font-weight:700;font-size:13px;color:var(--ink-soft);margin-bottom:8px;text-align:center;}
  .palette{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:18px;}
  .swatch{width:46px;height:46px;border-radius:50%;border:none;cursor:pointer;color:#fff;font-size:18px;
    display:flex;align-items:center;justify-content:center;transition:transform .12s;}
  .swatch:hover{transform:translateY(-3px);}
  .swatch:active{transform:translateY(1px);}

  .card-foot{display:flex;justify-content:center;gap:10px;}
  .btn-check{background:linear-gradient(180deg,#8fe08f,var(--c-hijau));color:#fff;border:none;
    padding:12px 28px;border-radius:16px;font-weight:700;font-size:15px;cursor:pointer;
    box-shadow:0 4px 0 var(--c-hijau-dark);}
  .btn-check:disabled{opacity:.5;cursor:not-allowed;}
  .btn-reset{background:#eee2c9;color:var(--soil-dark);border:none;padding:12px 20px;
    border-radius:16px;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 4px 0 #cdbb8f;}

  .message{margin-top:14px;padding:12px 14px;border-radius:14px;font-weight:700;font-size:14px;
    text-align:center;display:none;}
  .message.show{display:block;}
  .message.win{background:#e3f5df;color:var(--c-hijau-dark);}
  .message.fail{background:#fbe1e1;color:var(--c-merah-dark);}
  .message.hint{background:#fdf0d8;color:var(--c-oranye-dark);}

  .confetti{position:fixed;top:-10px;width:9px;height:14px;z-index:99;pointer-events:none;
    animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.3;}}

  .footnote{position:relative;z-index:5;text-align:center;color:var(--ink-soft);font-size:12px;
    font-weight:600;padding:6px 16px 30px;}

  @media(max-width:420px){
    .flower{width:42px;height:42px;font-size:20px;}
    .swatch{width:40px;height:40px;}
    .header h1{font-size:26px;}
  }
</style>
</head>
<body>

  <div class="header">
    <div class="eyebrow">🌼 CODING UNPLUGGED</div>
    <h1>Ladang Pola</h1>
    <p>Perhatikan urutan warnanya, lalu isi bunga yang kosong sesuai polanya!</p>
  </div>

  <div class="level-row" id="levelRow"></div>

  <div class="stage">
    <div class="card">
      <div class="card-title">
        <h2 id="cardTitle">Ladang 1</h2>
      </div>
      <p class="instr">Ketuk bunga kosong (bertanda ?), lalu pilih warna yang menurutmu sesuai pola.</p>

      <div class="pattern-row" id="patternRow"></div>

      <div class="palette-label">🎨 Pilih warna</div>
      <div class="palette" id="palette"></div>

      <div class="card-foot">
        <button class="btn-check" id="btnCheck">✅ Periksa Pola</button>
        <button class="btn-reset" id="btnReset">↺ Ulangi</button>
      </div>
      <div class="message" id="message"></div>
    </div>
  </div>

  <div class="footnote">© 2026 DEE 4 MEREMBU • All Rights Reserved.</div>

<script>
  const LEVELS = [
    { name:'Ladang 1', sequence:['merah','kuning','merah','kuning','merah','kuning'], blanks:[5] },
    { name:'Ladang 2', sequence:['biru','hijau','biru','hijau','biru','hijau','biru','hijau'], blanks:[6,7] },
    { name:'Ladang 3', sequence:['merah','kuning','biru','merah','kuning','biru','merah','kuning','biru'], blanks:[8] },
    { name:'Ladang 4', sequence:['ungu','oranye','hijau','ungu','oranye','hijau','ungu','oranye','hijau'], blanks:[7,8] },
    { name:'Ladang 5', sequence:['merah','merah','kuning','merah','merah','kuning','merah','merah','kuning'], blanks:[7,8] },
    { name:'Ladang 6', sequence:['biru','hijau','hijau','biru','hijau','hijau','biru','hijau','hijau'], blanks:[7,8] },
    { name:'Ladang 7', sequence:['merah','kuning','biru','ungu','merah','kuning','biru','ungu'], blanks:[6,7] },
    { name:'Ladang 8', sequence:['oranye','oranye','hijau','hijau','oranye','oranye','hijau','hijau'], blanks:[6,7] },
    { name:'Ladang 9', sequence:['merah','biru','merah','kuning','merah','biru','merah','kuning','merah','biru','merah','kuning'], blanks:[4,7,10] },
    { name:'Ladang 10', sequence:['ungu','hijau','oranye','hijau','biru','ungu','hijau','oranye','hijau','biru'], blanks:[4,6,8] }
  ];

  const COLOR_NAMES = { merah:'Merah', kuning:'Kuning', biru:'Biru', hijau:'Hijau', ungu:'Ungu', oranye:'Oranye' };
  const ALL_COLORS = ['merah','kuning','biru','hijau','ungu','oranye'];

  let currentLevel = 0;
  let answers = {};
  let selectedBlank = null;
  let solved = JSON.parse(localStorage.getItem('ladangpola_solved') || '[]');

  const levelRowEl = document.getElementById('levelRow');
  const cardTitleEl = document.getElementById('cardTitle');
  const patternRowEl = document.getElementById('patternRow');
  const paletteEl = document.getElementById('palette');
  const messageEl = document.getElementById('message');

  function buildLevelPicker(){
    levelRowEl.innerHTML = '';
    LEVELS.forEach((lvl, i) => {
      const dot = document.createElement('div');
      dot.className = 'level-dot' + (i === currentLevel ? ' active' : '') + (solved.includes(i) ? ' solved' : '');
      if (!solved.includes(i)) dot.innerText = (i + 1);
      dot.onclick = () => loadLevel(i);
      levelRowEl.appendChild(dot);
    });
  }

  function loadLevel(i){
    currentLevel = i;
    answers = {};
    selectedBlank = null;
    messageEl.className = 'message';
    cardTitleEl.innerText = LEVELS[i].name;
    buildLevelPicker();
    renderPattern();
    renderPalette();
  }

  function renderPattern(){
    const lvl = LEVELS[currentLevel];
    patternRowEl.innerHTML = '';
    lvl.sequence.forEach((color, idx) => {
      const isBlank = lvl.blanks.includes(idx);
      const el = document.createElement('div');
      if (isBlank){
        const chosen = answers[idx];
        el.className = 'flower blank' + (chosen ? ' color-' + chosen : '') + (selectedBlank === idx ? ' selected' : '');
        el.innerText = chosen ? '🌸' : '?';
        if (chosen) el.classList.add('filled');
        el.onclick = () => { selectedBlank = idx; renderPattern(); };
      } else {
        el.className = 'flower filled color-' + color;
        el.innerText = '🌸';
      }
      patternRowEl.appendChild(el);
    });
  }

  function renderPalette(){
    paletteEl.innerHTML = '';
    ALL_COLORS.forEach(color => {
      const btn = document.createElement('button');
      btn.className = 'swatch color-' + color;
      btn.title = COLOR_NAMES[color];
      btn.innerText = '🌸';
      btn.onclick = () => {
        if (selectedBlank === null){
          showMessage('hint', 'Ketuk dulu bunga bertanda ? yang mau diisi ya!');
          return;
        }
        answers[selectedBlank] = color;
        const lvl = LEVELS[currentLevel];
        const idxInBlanks = lvl.blanks.indexOf(selectedBlank);
        const nextBlank = lvl.blanks[idxInBlanks + 1];
        selectedBlank = (nextBlank !== undefined && !(nextBlank in answers)) ? nextBlank : null;
        messageEl.className = 'message';
        renderPattern();
      };
      paletteEl.appendChild(btn);
    });
  }

  function showMessage(type, text){
    messageEl.innerText = text;
    messageEl.className = 'message show ' + type;
  }

  document.getElementById('btnCheck').onclick = () => {
    const lvl = LEVELS[currentLevel];
    const missing = lvl.blanks.some(idx => !(idx in answers));
    if (missing){
      showMessage('hint', 'Isi semua bunga kosong dulu sebelum diperiksa ya!');
      return;
    }
    let allCorrect = true;
    lvl.blanks.forEach(idx => {
      const el = patternRowEl.children[idx];
      if (answers[idx] === lvl.sequence[idx]){
        el.classList.remove('wrong');
      } else {
        allCorrect = false;
        el.classList.add('wrong');
      }
    });
    if (allCorrect){
      showMessage('win', '🎉 Tepat sekali! Pola bunganya benar semua!');
      if (!solved.includes(currentLevel)){
        solved.push(currentLevel);
        localStorage.setItem('ladangpola_solved', JSON.stringify(solved));
        buildLevelPicker();
      }
      launchConfetti();
    } else {
      showMessage('fail', 'Ada yang belum pas. Lihat lagi pola di sebelah kirinya ya!');
    }
  };

  document.getElementById('btnReset').onclick = () => {
    answers = {};
    selectedBlank = null;
    messageEl.className = 'message';
    renderPattern();
  };

  function launchConfetti(){
    const colors = ['#e2555f', '#f4c548', '#4a9fc9', '#5ba64a', '#9b72cf', '#e88a3c'];
    for (let i = 0; i < 60; i++){
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = (2.2 + Math.random() * 1.6) + 's';
      c.style.animationDelay = (Math.random() * 0.4) + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 4200);
    }
  }

  buildLevelPicker();
  loadLevel(0);
</script>
</body>
</html>

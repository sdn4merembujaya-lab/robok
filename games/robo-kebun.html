<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Robo Kebun — Ayo Ngoding!</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#ffd9a0;--sky-bottom:#fff3da;
    --soil:#7a4a2b;--soil-dark:#5e3620;
    --card:#fffaf0;--ink:#3a2f2a;--ink-soft:#7a6a5c;
    --grass:#8fcf7a;--grass-dark:#5ba64a;
    --c-biru:#4a9fc9;--c-biru-dark:#2f7796;
    --c-merah:#e2555f;--c-merah-dark:#b93b46;
    --c-kuning:#f4c548;--c-kuning-dark:#cf9e1f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:'Quicksand',sans-serif;color:var(--ink);
    background:linear-gradient(180deg,var(--sky-top) 0%, var(--sky-bottom) 55%);min-height:100vh;}
  h1,h2,h3{font-family:'Fredoka',sans-serif;}
  button{font-family:inherit;}

  .header{text-align:center;padding:22px 16px 6px;}
  .eyebrow{display:inline-block;background:var(--c-biru);color:#fff;font-weight:700;font-size:12px;
    letter-spacing:.04em;padding:5px 14px;border-radius:20px;box-shadow:0 3px 0 var(--c-biru-dark);margin-bottom:10px;}
  .header h1{margin:0;font-size:30px;color:var(--soil-dark);}
  .header p{margin:6px auto 0;color:var(--ink-soft);font-weight:600;font-size:13.5px;max-width:420px;}

  .level-row{display:flex;justify-content:center;gap:9px;padding:16px 10px 4px;flex-wrap:wrap;max-width:640px;margin:0 auto;}
  .level-dot{width:38px;height:38px;border-radius:50%;border:3px solid var(--c-biru-dark);background:var(--card);
    font-weight:700;font-size:14px;color:var(--c-biru-dark);cursor:pointer;display:flex;align-items:center;
    justify-content:center;box-shadow:0 3px 0 var(--c-biru-dark);flex-shrink:0;}
  .level-dot.active{background:var(--c-biru);color:#fff;}
  .level-dot.solved{background:var(--c-kuning);border-color:var(--c-kuning-dark);color:var(--soil-dark);
    box-shadow:0 3px 0 var(--c-kuning-dark);}
  .level-dot.solved::after{content:'✓';}

  .stage{max-width:640px;margin:14px auto 40px;padding:0 16px;}
  .card{background:var(--card);border:4px solid var(--soil);border-radius:22px;padding:20px 18px;
    box-shadow:0 8px 0 rgba(0,0,0,.08);}
  .card h2{margin:0 0 4px;font-size:18px;color:var(--soil-dark);text-align:center;}
  .card p.instr{margin:0 0 16px;color:var(--ink-soft);font-weight:600;font-size:13px;text-align:center;}

  .grid-wrap{display:flex;justify-content:center;margin-bottom:16px;}
  .grid{display:grid;gap:4px;background:#e7d9b6;border:3px dashed #cbb98c;border-radius:14px;padding:8px;}
  .cell{width:44px;height:44px;background:var(--grass);border-radius:8px;display:flex;align-items:center;
    justify-content:center;font-size:22px;position:relative;}
  .cell.obstacle{background:#c9b48a;}
  .cell.goal{background:#a9dc95;}

  .controls{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:14px;}
  .dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,48px);gap:6px;}
  .dbtn{border:none;border-radius:12px;font-size:20px;cursor:pointer;color:#fff;
    background:var(--c-biru);box-shadow:0 4px 0 var(--c-biru-dark);}
  .dbtn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--c-biru-dark);}
  .dbtn.up{grid-column:2;grid-row:1;}
  .dbtn.left{grid-column:1;grid-row:2;}
  .dbtn.down{grid-column:2;grid-row:2;}
  .dbtn.right{grid-column:3;grid-row:2;}

  .seq-label{font-weight:700;font-size:13px;color:var(--ink-soft);text-align:center;margin-bottom:6px;}
  .seq-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:38px;
    background:#f6ecd9;border:3px dashed #e0cda0;border-radius:14px;padding:8px;margin-bottom:16px;}
  .seq-chip{width:30px;height:30px;border-radius:8px;background:var(--c-biru);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:15px;}

  .card-foot{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;}
  .btn-run{background:linear-gradient(180deg,#8fe08f,var(--grass-dark));color:#fff;border:none;
    padding:12px 26px;border-radius:16px;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 4px 0 var(--grass-dark);}
  .btn-run:disabled{opacity:.5;cursor:not-allowed;}
  .btn-undo,.btn-reset{background:#eee2c9;color:var(--soil-dark);border:none;padding:12px 18px;
    border-radius:16px;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 4px 0 #cdbb8f;}

  .message{margin-top:14px;padding:12px 14px;border-radius:14px;font-weight:700;font-size:14px;text-align:center;display:none;}
  .message.show{display:block;}
  .message.win{background:#e3f5df;color:var(--grass-dark);}
  .message.fail{background:#fbe1e1;color:var(--c-merah-dark);}
  .message.hint{background:#fdf0d8;color:var(--c-kuning-dark);}

  .footnote{text-align:center;color:var(--ink-soft);font-size:12px;font-weight:600;padding:6px 16px 30px;}
</style>
</head>
<body>

  <div class="header">
    <div class="eyebrow">🤖 CODING UNPLUGGED</div>
    <h1>Robo Kebun</h1>
    <p>Susun urutan panah buat nuntun robot sampai ke bendera. Ketuk panah, lalu tekan Jalankan!</p>
  </div>

  <div class="level-row" id="levelRow"></div>

  <div class="stage">
    <div class="card">
      <h2 id="cardTitle">Kebun 1</h2>
      <p class="instr">Tekan tombol panah buat menambah langkah, lalu jalankan urutannya.</p>

      <div class="grid-wrap"><div class="grid" id="grid"></div></div>

      <div class="seq-label">📋 Urutan perintah</div>
      <div class="seq-row" id="seqRow"></div>

      <div class="controls">
        <div class="dpad">
          <button class="dbtn up" data-dir="atas">⬆️</button>
          <button class="dbtn left" data-dir="kiri">⬅️</button>
          <button class="dbtn down" data-dir="bawah">⬇️</button>
          <button class="dbtn right" data-dir="kanan">➡️</button>
        </div>
      </div>

      <div class="card-foot">
        <button class="btn-run" id="btnRun">▶️ Jalankan</button>
        <button class="btn-undo" id="btnUndo">⌫ Hapus</button>
        <button class="btn-reset" id="btnReset">↺ Ulangi</button>
      </div>
      <div class="message" id="message"></div>
    </div>
  </div>

  <div class="footnote">Robo Kebun · latihan urutan perintah (sequence) ala coding unplugged 🌱</div>

<script>
  const LEVELS = [
    { rows:2, cols:4, start:{r:0,c:0}, goal:{r:0,c:3}, obstacles:[] },
    { rows:4, cols:2, start:{r:0,c:0}, goal:{r:3,c:0}, obstacles:[] },
    { rows:3, cols:3, start:{r:0,c:0}, goal:{r:2,c:2}, obstacles:[] },
    { rows:4, cols:4, start:{r:0,c:0}, goal:{r:3,c:3}, obstacles:[{r:1,c:1},{r:2,c:2}] },
    { rows:5, cols:4, start:{r:0,c:0}, goal:{r:4,c:3}, obstacles:[{r:1,c:0},{r:2,c:1},{r:3,c:2}] },
    { rows:5, cols:5, start:{r:0,c:0}, goal:{r:4,c:4}, obstacles:[{r:0,c:2},{r:2,c:2},{r:4,c:2},{r:2,c:0},{r:2,c:4}] }
  ];
  const DELTA = { atas:{dr:-1,dc:0}, bawah:{dr:1,dc:0}, kiri:{dr:0,dc:-1}, kanan:{dr:0,dc:1} };
  const ARROW = { atas:'⬆️', bawah:'⬇️', kiri:'⬅️', kanan:'➡️' };

  let currentLevel = 0, sequence = [], running = false;
  let solved = JSON.parse(localStorage.getItem('robokebun_solved') || '[]');

  const levelRowEl = document.getElementById('levelRow');
  const cardTitleEl = document.getElementById('cardTitle');
  const gridEl = document.getElementById('grid');
  const seqRowEl = document.getElementById('seqRow');
  const messageEl = document.getElementById('message');
  const btnRun = document.getElementById('btnRun');

  function buildLevelPicker(){
    levelRowEl.innerHTML = '';
    LEVELS.forEach((lvl,i)=>{
      const dot = document.createElement('div');
      dot.className = 'level-dot' + (i===currentLevel?' active':'') + (solved.includes(i)?' solved':'');
      if (!solved.includes(i)) dot.innerText = (i+1);
      dot.onclick = () => loadLevel(i);
      levelRowEl.appendChild(dot);
    });
  }

  function loadLevel(i){
    currentLevel = i; sequence = []; running = false;
    messageEl.className = 'message';
    cardTitleEl.innerText = 'Kebun ' + (i+1);
    buildLevelPicker();
    renderGrid();
    renderSeq();
  }

  function isObstacle(lvl,r,c){ return lvl.obstacles.some(o=>o.r===r&&o.c===c); }

  function renderGrid(pos){
    const lvl = LEVELS[currentLevel];
    const p = pos || lvl.start;
    gridEl.style.gridTemplateColumns = `repeat(${lvl.cols}, 44px)`;
    gridEl.innerHTML = '';
    for (let r=0;r<lvl.rows;r++){
      for (let c=0;c<lvl.cols;c++){
        const cell = document.createElement('div');
        cell.className = 'cell';
        if (isObstacle(lvl,r,c)) { cell.classList.add('obstacle'); cell.innerText = '🪨'; }
        else if (r===lvl.goal.r && c===lvl.goal.c) { cell.classList.add('goal'); cell.innerText = '🚩'; }
        if (r===p.r && c===p.c) cell.innerText = '🤖';
        gridEl.appendChild(cell);
      }
    }
  }

  function renderSeq(){
    seqRowEl.innerHTML = '';
    sequence.forEach(dir=>{
      const chip = document.createElement('div');
      chip.className = 'seq-chip';
      chip.innerText = ARROW[dir];
      seqRowEl.appendChild(chip);
    });
  }

  document.querySelectorAll('.dbtn').forEach(btn=>{
    btn.onclick = () => {
      if (running) return;
      sequence.push(btn.dataset.dir);
      renderSeq();
      messageEl.className = 'message';
    };
  });

  document.getElementById('btnUndo').onclick = () => {
    if (running) return;
    sequence.pop(); renderSeq();
  };
  document.getElementById('btnReset').onclick = () => {
    if (running) return;
    sequence = []; renderSeq(); renderGrid();
    messageEl.className = 'message';
  };

  btnRun.onclick = () => {
    if (running || sequence.length===0){
      if (sequence.length===0) showMessage('hint','Susun dulu perintahnya pakai tombol panah ya!');
      return;
    }
    running = true; btnRun.disabled = true;
    const lvl = LEVELS[currentLevel];
    let pos = { r: lvl.start.r, c: lvl.start.c };
    let step = 0;

    function tick(){
      if (step >= sequence.length){
        running = false; btnRun.disabled = false;
        if (pos.r === lvl.goal.r && pos.c === lvl.goal.c){
          showMessage('win','🎉 Sampai! Robot berhasil ke bendera!');
          if (!solved.includes(currentLevel)){
            solved.push(currentLevel);
            localStorage.setItem('robokebun_solved', JSON.stringify(solved));
            buildLevelPicker();
          }
        } else {
          showMessage('fail','Belum sampai ke bendera. Coba atur ulang urutannya!');
        }
        return;
      }
      const d = DELTA[sequence[step]];
      const nr = pos.r + d.dr, nc = pos.c + d.dc;
      if (nr<0 || nr>=lvl.rows || nc<0 || nc>=lvl.cols || isObstacle(lvl,nr,nc)){
        running = false; btnRun.disabled = false;
        showMessage('fail','Robot nabrak batu / keluar kebun! Coba lagi ya.');
        renderGrid(pos);
        return;
      }
      pos = { r:nr, c:nc };
      renderGrid(pos);
      step++;
      setTimeout(tick, 420);
    }
    tick();
  };

  function showMessage(type,text){
    messageEl.innerText = text;
    messageEl.className = 'message show ' + type;
  }

  buildLevelPicker();
  loadLevel(0);
</script>
</body>
</html>

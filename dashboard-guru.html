<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Dashboard Guru — Robo Kebun</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#ffd9a0;--sky-bottom:#fff3da;
    --soil:#7a4a2b;--soil-dark:#5e3620;
    --card:#fffaf0;
    --ink:#3a2f2a;--ink-soft:#7a6a5c;
    --c-merah-dark:#b93b46;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;font-family:'Quicksand',sans-serif;color:var(--ink);
    background:linear-gradient(180deg,var(--sky-top) 0%, var(--sky-bottom) 45%, #f3e6c4 100%);
    min-height:100vh;padding:20px 16px 60px;
  }
  h1,.display{font-family:'Fredoka',sans-serif;}
  a{text-decoration:none;}

  .topbar{max-width:680px;margin:0 auto 22px;display:flex;align-items:center;
    justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .topbar .hello{font-weight:700;color:var(--soil-dark);font-size:15px;}
  .topbar a.logout{background:var(--c-merah-dark);color:#fff;font-family:'Fredoka',sans-serif;
    font-weight:600;font-size:13.5px;padding:8px 18px;border-radius:12px;
    box-shadow:0 3px 0 rgba(0,0,0,.15);}
  .topbar a.logout:active{transform:translateY(2px);box-shadow:none;}

  h1{text-align:center;font-size:clamp(24px,5vw,32px);color:var(--soil-dark);margin:0 0 6px;}
  .sub{text-align:center;color:var(--ink-soft);font-weight:600;font-size:14px;
    max-width:520px;margin:0 auto 28px;}

  .card{max-width:680px;margin:0 auto 18px;background:var(--card);border:4px solid var(--soil);
    border-radius:22px;padding:22px;box-shadow:0 8px 0 rgba(0,0,0,.08);text-align:center;
    color:var(--ink-soft);font-weight:600;}
</style>
</head>
<body>

  <div class="topbar">
    <span class="hello" id="helloText">Halo, Guru</span>
    <a class="logout" href="#" id="logoutBtn">Keluar</a>
  </div>

  <h1>📊 Dashboard Guru</h1>
  <p class="sub">Rekap nilai siswa dari semua game.</p>

  <div class="card" id="loadingCard">Memuat data nilai...</div>

  <div id="tableWrap" style="display:none;max-width:680px;margin:0 auto;">
    <table id="nilaiTable" style="width:100%;border-collapse:collapse;background:var(--card);
      border:4px solid var(--soil);border-radius:16px;overflow:hidden;">
      <thead>
        <tr style="background:var(--soil);color:#fff;font-family:'Fredoka',sans-serif;">
          <th style="padding:10px 12px;text-align:left;">Nama Siswa</th>
          <th style="padding:10px 12px;text-align:center;">Jumlah Main</th>
          <th style="padding:10px 12px;text-align:center;">Rata-rata</th>
          <th style="padding:10px 12px;text-align:left;">Main Terakhir</th>
        </tr>
      </thead>
      <tbody id="nilaiBody"></tbody>
    </table>
  </div>

<script>
  (function () {
    var raw = sessionStorage.getItem('robokebun_user');
    if (!raw) {
      window.location.href = 'login.html';
      return;
    }
    try {
      var session = JSON.parse(raw);
      if (session.role !== 'guru') {
        window.location.href = 'login.html';
        return;
      }
      var nama = (session.user && session.user.Nama) ? session.user.Nama : session.user.Username;
      document.getElementById('helloText').textContent = 'Halo, ' + nama;
    } catch (err) {
      window.location.href = 'login.html';
    }
  })();

  document.getElementById('logoutBtn').addEventListener('click', function (e) {
    e.preventDefault();
    sessionStorage.removeItem('robokebun_user');
    window.location.href = 'login.html';
  });

  // ==== ambil & tampilkan rekap nilai ====
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwCJEpXP9XuKDik6Wbwk78Jq0jkd4Yp394DXskwYdFR_Dnx3zdd8_q54yav1ZPIOn5wAg/exec';

  async function ambilSheet(nama){
    const res = await fetch(APPS_SCRIPT_URL + '?sheet=' + encodeURIComponent(nama));
    const json = await res.json();
    if(!json.success) throw new Error(json.message || ('Gagal mengambil ' + nama));
    return json.data;
  }

  function persenDariSkor(skorStr){
    const parts = String(skorStr).split('/');
    if(parts.length !== 2) return 0;
    const a = parseFloat(parts[0]), b = parseFloat(parts[1]);
    if(!b) return 0;
    return a / b;
  }

  async function muatRekap(){
    try{
      const [students, progress] = await Promise.all([
        ambilSheet('STUDENTS'),
        ambilSheet('PROGRESS')
      ]);

      const byStudent = {};
      progress.forEach(function(p){
        const id = p.StudentID;
        if(!id) return;
        if(!byStudent[id]) byStudent[id] = { count:0, sumPersen:0, last:null };
        byStudent[id].count++;
        byStudent[id].sumPersen += persenDariSkor(p.Skor);
        const lastDate = byStudent[id].last ? new Date(byStudent[id].last.Tanggal) : null;
        const thisDate = new Date(p.Tanggal);
        if(!lastDate || thisDate > lastDate){ byStudent[id].last = p; }
      });

      const rows = students.map(function(s){
        const m = byStudent[s.ID] || { count:0, sumPersen:0, last:null };
        return {
          nama: s.Nama || s.Username || '(tanpa nama)',
          jumlahMain: m.count,
          rataRata: m.count ? Math.round((m.sumPersen / m.count) * 100) + '%' : '-',
          terakhir: m.last ? (m.last.Game + ' (' + m.last.Skor + ')') : '-'
        };
      });

      rows.sort(function(a,b){ return b.jumlahMain - a.jumlahMain; });

      const tbody = document.getElementById('nilaiBody');
      tbody.innerHTML = '';
      rows.forEach(function(r){
        const tr = document.createElement('tr');
        tr.style.borderTop = '1px solid #eee0c8';
        tr.innerHTML =
          '<td style="padding:9px 12px;">' + r.nama + '</td>' +
          '<td style="padding:9px 12px;text-align:center;">' + r.jumlahMain + '</td>' +
          '<td style="padding:9px 12px;text-align:center;">' + r.rataRata + '</td>' +
          '<td style="padding:9px 12px;">' + r.terakhir + '</td>';
        tbody.appendChild(tr);
      });

      document.getElementById('loadingCard').style.display = 'none';
      document.getElementById('tableWrap').style.display = 'block';
    }catch(err){
      document.getElementById('loadingCard').textContent = 'Gagal memuat data: ' + err.message;
    }
  }

  muatRekap();
</script>
</body>
</html>
